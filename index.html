<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>19遠端簽到系統</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 450px; margin: 20px auto; padding: 20px; background: #eef2f5; }
        
        /* 標題與版本號 */
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { margin: 0; color: #2c3e50; display: inline-block; }
        .version-tag { font-size: 12px; background: transparent; color: #2c3e50; padding: 2px 8px; border-radius: 12px; cursor: pointer; user-select: none; margin-left: 5px; }

        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        
        /* 預設隱藏區域 */
        .hidden-section { display: none; }

        button, select, input { padding: 12px; margin: 5px 0; width: 100%; box-sizing: border-box; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; }
        button { cursor: pointer; border: none; font-weight: bold; transition: all 0.2s; }
        button:disabled { background: #dcdde1 !important; color: #7f8c8d !important; cursor: not-allowed; }
        button:active:not(:disabled) { transform: scale(0.98); }
        .grid-btn { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        
        /* 雙指示燈 */
        .status-panel { display: flex; gap: 10px; margin-bottom: 20px; }
        .status-box { flex: 1; padding: 10px; text-align: center; border-radius: 8px; font-weight: bold; color: white; font-size: 13px; }
        .bg-gray { background: #95a5a6; }
        .bg-red { background: #e74c3c; }
        .bg-green { background: #2ecc71; }

        /* 成功發送提示 Toast */
        #toast {
            visibility: hidden;
            min-width: 200px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 12px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            top: 30px;
            transform: translateX(-50%);
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        #toast.show { visibility: visible; animation: fadein 0.3s, fadeout 0.3s 1.7s; }

        @keyframes fadein { from { top: 0; opacity: 0; } to { top: 30px; opacity: 1; } }
        @keyframes fadeout { from { top: 30px; opacity: 1; } to { top: 0; opacity: 0; } }

        /* 頁尾連結 */
        .footer { text-align: center; font-size: 14px; margin-top: 30px; }
        .footer a { color: #3498db; text-decoration: none; font-weight: bold; }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div id="toast">發送成功！</div>

    <!-- 頂部標題與版本號 -->
    <div class="header">
        <h2>19遠端簽到系統</h2>
        <span id="versionBtn" class="version-tag" onclick="clickVersion()">v1.1.0</span>
    </div>

    <!-- 連線狀態面板 -->
    <div class="status-panel">
        <div id="webStatus" class="status-box bg-red">網頁雲端: 斷線</div>
        <div id="espStatus" class="status-box bg-gray">神秘小東東: 未知</div>
    </div>

    <!-- 預設輸入區域 (預設顯示) -->
    <div class="card">
        <h3>📂 選取座號</h3>
        <select id="presetSelect">
            <option value="">載入中...</option>
        </select>
        <button id="btnPreset" onclick="sendPreset()" style="background:#27ae60; color:white;">發送預設值</button>
    </div>

    <!-- 自訂輸入區域 (預設隱藏) -->
    <div id="secCustom" class="card hidden-section">
        <h3>⌨ 自訂輸入</h3>
        <input type="text" id="customInput" placeholder="要輸入的字...">
        <button id="btnCustom" onclick="sendCustom()" style="background:#3498db; color:white;">發送文字</button>
    </div>

    <!-- 鍵盤控制鍵區域 (預設隱藏) -->
    <div id="secControl" class="card hidden-section">
        <h3>🕹️ 控制鍵</h3>
        <div class="grid-btn">
            <button class="cmd-btn" onclick="sendCmd('KEY_ESC')" style="background:#e67e22; color:white;">ESC</button>
            <button class="cmd-btn" onclick="sendCmd('KEY_UP')" style="background:#bdc3c7;">⬆️</button>
            <button class="cmd-btn" onclick="sendCmd('KEY_TAB')" style="background:#9b59b6; color:white;">TAB</button>
            
            <button class="cmd-btn" onclick="sendCmd('KEY_LEFT')" style="background:#bdc3c7;">⬅️</button>
            <button class="cmd-btn" onclick="sendCmd('KEY_DOWN')" style="background:#bdc3c7;">⬇️</button>
            <button class="cmd-btn" onclick="sendCmd('KEY_RIGHT')" style="background:#bdc3c7;">➡️</button>
            
            <div></div>
            <button class="cmd-btn" onclick="sendCmd('KEY_ENTER')" style="background:#e74c3c; color:white;">ENTER</button>
            <div></div>
        </div>
    </div>

    <!-- 頁尾超連結 -->
    <div class="footer">
        <a href="https://docs.google.com/spreadsheets/d/1qJ38PUGd9YOmN7-RAYHMNFRwnk9aVbld_aDuKuJSJso/edit?usp=sharing" target="_blank">簽到確認</a>
    </div>

    <script>
        const brokerUrl = 'wss://broker.emqx.io:8084/mqtt';
        const topicCmd = 'my_esp32s3zero_1145141919810_8964/hid/command'; 
        const topicStatus = 'my_esp32s3zero_1145141919810_8964/hid/status'; // 用於接收硬體在線狀態
        
        let isWebConnected = false;
        let isEspConnected = false;
        let versionClickCount = 0;

        const client = mqtt.connect(brokerUrl, {
            clientId: 'web_client_' + Math.random().toString(16).substr(2, 8)
        });

        const webStatusDiv = document.getElementById('webStatus');
        const espStatusDiv = document.getElementById('espStatus');

        // 更新 UI 鎖定狀態
        function updateUIState() {
            const canSend = isWebConnected && isEspConnected;
            const buttons = document.querySelectorAll('button');
            buttons.forEach(btn => btn.disabled = !canSend);
        }

        // MQTT 事件
        client.on('connect', () => {
            isWebConnected = true;
            webStatusDiv.textContent = '網頁雲端: 已連線';
            webStatusDiv.className = 'status-box bg-green';
            client.subscribe(topicStatus);
            updateUIState();

            // 連線後立即發送心跳包喚醒 神秘小東東
            sendHeartbeat();
        });

        client.on('offline', () => {
            isWebConnected = false;
            isEspConnected = false;
            webStatusDiv.textContent = '網頁雲端: 斷線';
            webStatusDiv.className = 'status-box bg-red';
            espStatusDiv.textContent = '神秘小東東: 未知';
            espStatusDiv.className = 'status-box bg-gray';
            updateUIState();
        });

        client.on('message', (topic, message) => {
            if (topic === topicStatus) {
                const status = message.toString();
                if (status === 'online') {
                    isEspConnected = true;
                    espStatusDiv.textContent = '神秘小東東: 上線待命';
                    espStatusDiv.className = 'status-box bg-green';
                } else {
                    isEspConnected = false;
                    espStatusDiv.textContent = '神秘小東東: 離線';
                    espStatusDiv.className = 'status-box bg-red';
                }
                updateUIState();
            }
        });

        // 讀取 JSON
        fetch('commands.json')
            .then(res => res.json())
            .then(data => {
                const select = document.getElementById('presetSelect');
                select.innerHTML = ''; 
                for (const [key, value] of Object.entries(data)) {
                    const option = document.createElement('option');
                    option.text = key;
                    option.value = value;
                    select.appendChild(option);
                }
            })
            .catch(() => {
                document.getElementById('presetSelect').innerHTML = '<option value="">載入失敗</option>';
            });

        // 顯示提示訊息 (Toast)
        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.textContent = msg;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2000);
        }

        // 發送指令核心
        function sendCmd(command) {
            if (!isWebConnected || !isEspConnected) {
                alert("⚠️ 雲端與 神秘小東東 必須皆處於連線狀態才能發送指令！");
                return;
            }
            client.publish(topicCmd, command, {}, (err) => {
                if (!err) {
                    showToast("✅ 指令發送成功！");
                }
            });
        }

        function sendPreset() {
            const val = document.getElementById('presetSelect').value;
            if (!val) return;
            sendCmd('TYPE:' + val);
            setTimeout(() => sendCmd('KEY_ENTER'), 200);
        }

        function sendCustom() {
            const input = document.getElementById('customInput');
            if (!input.value) return;
            sendCmd('TYPE:' + input.value);
            input.value = ''; 
        }

        // 定時心跳包 (每 30 秒發送一次，避免 神秘小東東 進入休眠)
        function sendHeartbeat() {
            if (isWebConnected) {
                client.publish(topicCmd, 'HEARTBEAT');
            }
        }
        setInterval(sendHeartbeat, 30000);

        // 連續點擊版本號 7 次觸發隱藏功能
        function clickVersion() {
            versionClickCount++;
            if (versionClickCount === 7) {
                document.getElementById('secCustom').style.display = 'block';
                document.getElementById('secControl').style.display = 'block';
                showToast("🔓 已解鎖進階控制面板！");
                versionClickCount = 0;
            }
        }

        // 初始進入時將所有按鈕設為禁用，等待雙向連線完成
        updateUIState();
    </script>
</body>
</html>
